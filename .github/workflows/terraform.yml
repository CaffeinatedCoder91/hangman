name: Terraform

# Pull requests receive validation and a plan. Merges to main apply staging and
# publish the frontend. Terraform test-stage experiments remain local/manual.
on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - "infrastructure/**"
      - "scripts/deploy-terraform-frontend.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "shared/**"
      - "infrastructure/**"
      - "scripts/deploy-terraform-frontend.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/terraform.yml"

# id-token: write lets GitHub request a short-lived OIDC token. AWS exchanges
# it for temporary role credentials, so no long-lived access keys are stored.
permissions:
  contents: read
  id-token: write

# State locking protects Terraform itself; this group also avoids wasting CI
# time by serializing staging runs and cancelling superseded branch plans.
concurrency:
  group: terraform-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: terraform-staging
    env:
      AWS_REGION: eu-west-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Pin the same stable version used during local validation. Renovate
          # or a deliberate maintenance change can upgrade this transparently.
          terraform_version: "1.15.9"

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run application checks
        run: npm run check

      - name: Bundle Lambda
        run: npm run build:lambda

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/app fmt -check

      - name: Initialize staging state
        run: >-
          terraform -chdir=infrastructure/app init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=hangman/staging/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=infrastructure/app validate

      - name: Plan staging
        run: terraform -chdir=infrastructure/app plan -var-file=staging.tfvars -out=staging.tfplan

      # Pull requests stop after producing a plan. Only reviewed code merged to
      # main is allowed to mutate staging infrastructure.
      - name: Apply staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform -chdir=infrastructure/app apply -auto-approve staging.tfplan

      - name: Publish frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/deploy-terraform-frontend.sh

      - name: Show deployment URLs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform -chdir=infrastructure/app output
